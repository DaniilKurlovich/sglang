name: Build and Push to GHCR (fork)

# Standalone workflow for forks: builds docker/Dockerfile on a GitHub-hosted
# runner and pushes to the fork owner's GHCR. Run manually from Actions tab.

on:
  push:
    branches:
      - vsa_h3_bench
  workflow_dispatch:
    inputs:
      cuda_version:
        description: "CUDA version to build"
        required: true
        type: choice
        options:
          - "13.0.3"
          - "12.9.2"
        default: "13.0.3"
      docker_target:
        description: "Dockerfile target stage (framework = dev image, runtime = slimmer prod image)"
        required: true
        type: choice
        options:
          - framework
          - runtime
        default: framework
      tag:
        description: "Image tag (default: branch name)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  CUDA_VERSION: ${{ inputs.cuda_version || '13.0.3' }}
  DOCKER_TARGET: ${{ inputs.docker_target || 'framework' }}
  IMAGE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: ghcr-build-${{ inputs.cuda_version || '13.0.3' }}-${{ inputs.docker_target || 'framework' }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          docker-images: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/sglang
        run: |
          set -euo pipefail
          # GHCR requires lowercase repository names
          IMAGE=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')
          docker buildx build \
            --target ${DOCKER_TARGET} \
            --platform linux/amd64 \
            -f docker/Dockerfile.vsa_h3_bench \
            --build-arg CUDA_VERSION=${CUDA_VERSION} \
            --build-arg BUILD_TYPE=all \
            --build-arg BRANCH_TYPE=local \
            --build-arg INSTALL_FLASHINFER_JIT_CACHE=1 \
            --build-arg CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) \
            --build-arg SGLANG_IMAGE_TAG=${IMAGE}:${IMAGE_TAG} \
            --cache-from type=gha,scope=${CUDA_VERSION}-${DOCKER_TARGET} \
            --cache-to type=gha,mode=max,scope=${CUDA_VERSION}-${DOCKER_TARGET} \
            -t ${IMAGE}:${IMAGE_TAG} \
            --push \
            .
          echo "Pushed: ${IMAGE}:${IMAGE_TAG}"
