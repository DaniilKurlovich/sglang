name: Diffusion FP8 Attention Image

# Builds the diffusion attention test image (docker/diffusion-fp8-attn.Dockerfile)
# and pushes it to GHCR, to run on a rented SM89 / SM120 GPU (for example RunPod).
# See benchmark/diffusion_fp8_attn/README.md for the run commands.
# Pull requests only check that the image builds.

on:
  push:
    branches:
      - "diffusion/fp8-fa-sm89*"
  pull_request:
    branches: [main]
    paths:
      - "docker/diffusion-fp8-attn.Dockerfile*"
      - "benchmark/diffusion_fp8_attn/**"
      - "python/sglang/kernels/ops/attention/fp8_fa_sm120/**"
      - "python/sglang/multimodal_gen/runtime/layers/attention/backends/fp8_fa_sm120_attn.py"
      - "python/sglang/multimodal_gen/runtime/platforms/cuda.py"
      - "python/sglang/multimodal_gen/test/unit/test_fp8_fa_sm120_attn.py"
      - ".github/workflows/diffusion-fp8-attn.yml"
  workflow_dispatch:

concurrency:
  group: diffusion-fp8-attn-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sglang-diffusion-fp8-attn

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Pull requests (often from forks) cannot push, so they only build.
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      # The image carries the CUDA toolkit, torch and the diffusion extra.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          large-packages: false

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          image="${IMAGE,,}"
          branch="${GITHUB_REF_NAME//\//-}"
          {
            echo "tags<<EOF"
            echo "${image}:${GITHUB_SHA::12}"
            echo "${image}:${branch}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/diffusion-fp8-attn.Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=diffusion-fp8-attn
          cache-to: type=gha,mode=max,scope=diffusion-fp8-attn

      - name: Print image reference
        if: env.PUSH == 'true'
        run: |
          {
            echo "### Image"
            echo '```'
            echo "${{ steps.tags.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
